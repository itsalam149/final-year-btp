# ─────────────────────────────────────────────────────────────────
# run_config.yaml
# Central configuration for the Phase-1 ablation grid.
# All 27 runs (3 models × 3 methods × 3 bits) are defined here.
#
# BTech Project — Faqre Alam · Guneet Toppo · Ekansh Agrawal
# DTU 2026-27
# ─────────────────────────────────────────────────────────────────

# ── Experiment identity ──────────────────────────────────────────
experiment_name: "phase1_ablation_grid"
output_dir: "phase1/results"

# ── Models to evaluate ──────────────────────────────────────────
# All are open-weight, Apache 2.0, <1.3B params — fit on free T4
models:
  - id: "Qwen/Qwen2.5-0.5B"
    short_name: "qwen2.5-0.5b"
  - id: "meta-llama/Llama-3.2-1B"
    short_name: "llama-3.2-1b"
  - id: "EleutherAI/pythia-1.4b"
    short_name: "pythia-1.4b"

# ── Quantization methods ─────────────────────────────────────────
methods:
  - rtn           # Round-To-Nearest (no calibration data used)
  - gptq          # Second-order Hessian compensation
  - gptq_hadamard # Hadamard rotation + GPTQ

# ── Bit-widths ───────────────────────────────────────────────────
bits: [2, 3, 4]

# ── Calibration settings ─────────────────────────────────────────
calibration:
  dataset: "wikitext"
  dataset_config: "wikitext-2-raw-v1"
  split: "train"
  n_samples: 128          # number of calibration sequences
  seq_len: 2048           # tokens per sequence
  seed: 42                # fixed seed for reproducibility

# ── GPTQ hyperparameters ─────────────────────────────────────────
gptq:
  dampening_factor: 0.01  # ε = dampening_factor × mean(diag(H))
  block_size: 128         # lazy batch update block size

# ── Hadamard settings ────────────────────────────────────────────
hadamard:
  seed: 1337              # separate seed for rotation matrix

# ── Evaluation settings ──────────────────────────────────────────
eval:
  tasks:
    - wikitext            # perplexity on WikiText-2 test split
    - arc_easy            # 0-shot accuracy
    - hellaswag           # 0-shot accuracy
    - winogrande          # 0-shot accuracy
  batch_size: 8
  device: "auto"          # auto = mps (Apple Silicon) | cuda | cpu

# ── Layers to skip quantization ──────────────────────────────────────────
# Embedding and LM-head are always kept in FP16
# (standard practice — these are very sensitive)
skip_layer_names:
  - "embed_tokens"
  - "lm_head"
  - "embed_positions"

# ── Local test profile (Mac M4 / MPS) ─────────────────────────────────────
# Use these overrides when running locally to finish in ~5 min:
#   python phase1/run.py --profile local_test
local_test:
  models:
    - id: "Qwen/Qwen2.5-0.5B"
      short_name: "qwen2.5-0.5b"
  methods: [rtn]
  bits: [4]
  calibration:
    n_samples: 4          # 4 sequences (vs 128 full run)
    seq_len: 256          # 256 tokens  (vs 2048 full run)
    seed: 42
